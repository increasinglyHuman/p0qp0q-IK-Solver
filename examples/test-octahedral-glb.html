<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Test Octahedral Bone GLB Model</title>
	<style>
		body {
			margin: 0;
			overflow: hidden;
			font-family: monospace;
			background: #1a1a1a;
			color: #fff;
		}
		#info {
			position: absolute;
			top: 10px;
			left: 10px;
			padding: 20px;
			background: rgba(0, 0, 0, 0.8);
			border-radius: 8px;
			max-width: 400px;
		}
		#info h2 {
			margin: 0 0 10px 0;
			color: #4af;
		}
		.status {
			padding: 5px 10px;
			margin: 5px 0;
			border-radius: 4px;
			background: rgba(255, 255, 255, 0.1);
		}
		.success { background: rgba(0, 255, 0, 0.2); }
		.error { background: rgba(255, 0, 0, 0.2); }
		canvas {
			display: block;
		}
	</style>
</head>
<body>
	<div id="info">
		<h2>Octahedral Bone GLB Test</h2>
		<div class="status" id="status">Loading...</div>
		<div id="details"></div>
		<p style="margin-top: 20px; font-size: 12px; opacity: 0.7;">
			Mouse: Rotate | Scroll: Zoom
		</p>
	</div>

	<script type="importmap">
	{
		"imports": {
			"three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
			"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
		}
	}
	</script>

	<script type="module">
		import * as THREE from 'three';
		import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
		import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

		// Scene setup
		const scene = new THREE.Scene();
		scene.background = new THREE.Color(0x1a1a1a);

		const camera = new THREE.PerspectiveCamera(
			50,
			window.innerWidth / window.innerHeight,
			0.001,
			1000
		);
		camera.position.set(1.5, 1, 1.5);
		camera.lookAt(0, 0.5, 0);

		const renderer = new THREE.WebGLRenderer({ antialias: true });
		renderer.setSize(window.innerWidth, window.innerHeight);
		renderer.setPixelRatio(window.devicePixelRatio);
		document.body.appendChild(renderer.domElement);

		// Controls
		const controls = new OrbitControls(camera, renderer.domElement);
		controls.target.set(0, 0.5, 0);
		controls.update();

		// Lighting
		const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
		scene.add(ambientLight);

		const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
		directionalLight.position.set(5, 10, 5);
		scene.add(directionalLight);

		const directionalLight2 = new THREE.DirectionalLight(0xffffff, 0.4);
		directionalLight2.position.set(-5, 5, -5);
		scene.add(directionalLight2);

		// Grid helper
		const gridHelper = new THREE.GridHelper(10, 10, 0x444444, 0x222222);
		scene.add(gridHelper);

		// Axes helper
		const axesHelper = new THREE.AxesHelper(2);
		scene.add(axesHelper);

		// Status display
		const statusDiv = document.getElementById('status');
		const detailsDiv = document.getElementById('details');

		function updateStatus(message, isError = false) {
			statusDiv.textContent = message;
			statusDiv.className = isError ? 'status error' : 'status success';
		}

		function addDetail(label, value) {
			const detail = document.createElement('div');
			detail.style.margin = '5px 0';
			detail.innerHTML = `<strong>${label}:</strong> ${value}`;
			detailsDiv.appendChild(detail);
		}

		// Load the octahedral bone model
		const loader = new GLTFLoader();

		loader.load(
			'../models/octahedralBone.glb',
			(gltf) => {
				updateStatus('✓ GLB Model Loaded Successfully');

				console.log('GLB Scene:', gltf.scene);

				let boneFound = false;
				let sphereFound = false;
				let boneGeometry = null;
				let sphereGeometry = null;

				gltf.scene.traverse((child) => {
					console.log('Child:', child.name, child.type);

					if (child.isMesh) {
						console.log('  Mesh found:', child.name);
						console.log('  Geometry:', child.geometry);
						console.log('  Vertices:', child.geometry.attributes.position.count);

						if (child.name === 'OctahedralBone') {
							boneFound = true;
							boneGeometry = child.geometry;

							// Create material for bone
							const boneMaterial = new THREE.MeshPhongMaterial({
								color: 0x888888,
								flatShading: true,
								shininess: 30,
								side: THREE.DoubleSide
							});

							// Create mesh
							const boneMesh = new THREE.Mesh(child.geometry.clone(), boneMaterial);
							boneMesh.position.set(0, 0, 0);
							scene.add(boneMesh);

							addDetail('Bone Object', child.name);
							addDetail('Bone Vertices', child.geometry.attributes.position.count);

						} else if (child.name === 'JointSphere') {
							sphereFound = true;
							sphereGeometry = child.geometry;

							// Create material for sphere
							const sphereMaterial = new THREE.MeshPhongMaterial({
								color: 0xff4444,
								shininess: 60
							});

							// Create mesh
							const sphereMesh = new THREE.Mesh(child.geometry.clone(), sphereMaterial);
							sphereMesh.position.set(0, 0.2, 0); // 20% up from base
							scene.add(sphereMesh);

							addDetail('Sphere Object', child.name);
							addDetail('Sphere Vertices', child.geometry.attributes.position.count);
						}
					}
				});

				if (boneFound && sphereFound) {
					addDetail('Status', '✓ Both objects found!');
					addDetail('Bone Alignment', 'Y-axis (should point up)');
					addDetail('Sphere Position', '0.2 units up (20%)');
				} else {
					if (!boneFound) {
						updateStatus('⚠ OctahedralBone object not found!', true);
					}
					if (!sphereFound) {
						updateStatus('⚠ JointSphere object not found!', true);
					}
				}

				// Add reference cylinder for comparison
				const refCylinder = new THREE.Mesh(
					new THREE.CylinderGeometry(0.01, 0.01, 1.0, 8),
					new THREE.MeshBasicMaterial({
						color: 0x00ff00,
						transparent: true,
						opacity: 0.3,
						wireframe: true
					})
				);
				refCylinder.position.set(0.3, 0.5, 0);
				scene.add(refCylinder);

				addDetail('Reference', 'Green wireframe cylinder (1.0 unit tall)');
			},
			(progress) => {
				const percent = Math.round((progress.loaded / progress.total) * 100);
				updateStatus(`Loading... ${percent}%`);
			},
			(error) => {
				console.error('Error loading GLB:', error);
				updateStatus('✗ Error loading GLB model', true);
				addDetail('Error', error.message);
			}
		);

		// Animation loop
		function animate() {
			requestAnimationFrame(animate);
			controls.update();
			renderer.render(scene, camera);
		}

		// Handle window resize
		window.addEventListener('resize', () => {
			camera.aspect = window.innerWidth / window.innerHeight;
			camera.updateProjectionMatrix();
			renderer.setSize(window.innerWidth, window.innerHeight);
		});

		animate();
	</script>
</body>
</html>
