<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Compare Bone Alignments</title>
	<style>
		body {
			margin: 0;
			overflow: hidden;
			font-family: monospace;
			background: #1a1a1a;
			color: #fff;
		}
		#info {
			position: absolute;
			top: 10px;
			left: 10px;
			padding: 20px;
			background: rgba(0, 0, 0, 0.9);
			border-radius: 8px;
			max-width: 450px;
		}
		#info h2 {
			margin: 0 0 10px 0;
			color: #4af;
		}
		.button-group {
			margin: 15px 0;
		}
		.button-group button {
			display: block;
			width: 100%;
			margin: 8px 0;
			padding: 12px;
			background: #333;
			border: 2px solid #555;
			color: #fff;
			border-radius: 6px;
			cursor: pointer;
			font-family: monospace;
			font-size: 14px;
			transition: all 0.2s;
		}
		.button-group button:hover {
			background: #444;
			border-color: #4af;
		}
		.button-group button.active {
			background: #0066cc;
			border-color: #4af;
		}
		.status {
			padding: 10px;
			margin: 10px 0;
			border-radius: 4px;
			background: rgba(255, 255, 255, 0.1);
		}
		.success { background: rgba(0, 255, 0, 0.2); }
		.details {
			font-size: 13px;
			line-height: 1.6;
		}
		.details strong {
			color: #4af;
		}
	</style>
</head>
<body>
	<div id="info">
		<h2>🦴 Bone Alignment Comparison</h2>
		<div class="button-group">
			<button id="btn-original">
				<strong>Original</strong><br>
				<small>Y-axis in Blender + Y-up export</small>
			</button>
			<button id="btn-zup">
				<strong>Z-up Version</strong><br>
				<small>Z-axis in Blender + Y-up export</small>
			</button>
			<button id="btn-yup">
				<strong>Y-up Rotated</strong><br>
				<small>Rotated & normalized</small>
			</button>
		</div>
		<div class="status" id="status">Click a button to load</div>
		<div class="details" id="details"></div>
		<p style="margin-top: 20px; font-size: 12px; opacity: 0.7;">
			<strong>Look for:</strong><br>
			• Bone should point UP (Y-axis, green)<br>
			• Sphere at 0.2 units up<br>
			• Bone base at origin
		</p>
	</div>

	<script type="importmap">
	{
		"imports": {
			"three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
			"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
		}
	}
	</script>

	<script type="module">
		import * as THREE from 'three';
		import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
		import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

		// Scene setup
		const scene = new THREE.Scene();
		scene.background = new THREE.Color(0x1a1a1a);

		const camera = new THREE.PerspectiveCamera(
			50,
			window.innerWidth / window.innerHeight,
			0.001,
			1000
		);
		camera.position.set(1.5, 1, 1.5);
		camera.lookAt(0, 0.5, 0);

		const renderer = new THREE.WebGLRenderer({ antialias: true });
		renderer.setSize(window.innerWidth, window.innerHeight);
		renderer.setPixelRatio(window.devicePixelRatio);
		document.body.appendChild(renderer.domElement);

		// Controls
		const controls = new OrbitControls(camera, renderer.domElement);
		controls.target.set(0, 0.5, 0);
		controls.update();

		// Lighting
		const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
		scene.add(ambientLight);

		const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
		directionalLight.position.set(5, 10, 5);
		scene.add(directionalLight);

		const directionalLight2 = new THREE.DirectionalLight(0xffffff, 0.4);
		directionalLight2.position.set(-5, 5, -5);
		scene.add(directionalLight2);

		// Grid helper
		const gridHelper = new THREE.GridHelper(2, 20, 0x444444, 0x222222);
		scene.add(gridHelper);

		// Axes helper (BIG so we can see orientation clearly)
		const axesHelper = new THREE.AxesHelper(1.5);
		scene.add(axesHelper);

		// Status display
		const statusDiv = document.getElementById('status');
		const detailsDiv = document.getElementById('details');
		const loader = new GLTFLoader();
		let currentModels = [];

		function updateStatus(message, isError = false) {
			statusDiv.textContent = message;
			statusDiv.className = isError ? 'status error' : 'status success';
		}

		function clearDetails() {
			detailsDiv.innerHTML = '';
		}

		function addDetail(label, value) {
			const detail = document.createElement('div');
			detail.style.margin = '5px 0';
			detail.innerHTML = `<strong>${label}:</strong> ${value}`;
			detailsDiv.appendChild(detail);
		}

		function clearScene() {
			currentModels.forEach(obj => {
				scene.remove(obj);
				if (obj.geometry) obj.geometry.dispose();
				if (obj.material) obj.material.dispose();
			});
			currentModels = [];
		}

		function loadModel(path, label) {
			clearScene();
			clearDetails();
			updateStatus(`Loading ${label}...`);

			// Remove active class from all buttons
			document.querySelectorAll('.button-group button').forEach(btn => {
				btn.classList.remove('active');
			});

			loader.load(
				path,
				(gltf) => {
					updateStatus(`✓ ${label} Loaded`);
					addDetail('Model', label);

					console.log('Loaded:', label);

					let boneFound = false;
					let sphereFound = false;

					gltf.scene.traverse((child) => {
						if (child.isMesh) {
							console.log('  Mesh:', child.name, 'Vertices:', child.geometry.attributes.position.count);

							if (child.name === 'OctahedralBone') {
								boneFound = true;

								const boneMaterial = new THREE.MeshPhongMaterial({
									color: 0x888888,
									flatShading: true,
									shininess: 30,
									side: THREE.DoubleSide
								});

								const boneMesh = new THREE.Mesh(child.geometry.clone(), boneMaterial);
								boneMesh.position.set(0, 0, 0);
								scene.add(boneMesh);
								currentModels.push(boneMesh);

								addDetail('Bone', `✓ Found (${child.geometry.attributes.position.count} verts)`);

							} else if (child.name === 'JointSphere') {
								sphereFound = true;

								const sphereMaterial = new THREE.MeshPhongMaterial({
									color: 0xff4444,
									shininess: 60
								});

								const sphereMesh = new THREE.Mesh(child.geometry.clone(), sphereMaterial);
								sphereMesh.position.set(0, 0.2, 0);
								scene.add(sphereMesh);
								currentModels.push(sphereMesh);

								addDetail('Sphere', `✓ Found (${child.geometry.attributes.position.count} verts)`);
							}
						}
					});

					// Add reference cylinder
					const refCylinder = new THREE.Mesh(
						new THREE.CylinderGeometry(0.01, 0.01, 1.0, 8),
						new THREE.MeshBasicMaterial({
							color: 0x00ff00,
							transparent: true,
							opacity: 0.3,
							wireframe: true
						})
					);
					refCylinder.position.set(0.3, 0.5, 0);
					scene.add(refCylinder);
					currentModels.push(refCylinder);

					if (boneFound && sphereFound) {
						addDetail('Result', '✓ Both objects loaded');
						addDetail('Check', 'Bone pointing UP? (green Y-axis)');
					} else {
						updateStatus('⚠ Missing objects!', true);
					}
				},
				undefined,
				(error) => {
					console.error('Error loading:', error);
					updateStatus(`✗ Error loading ${label}`, true);
					addDetail('Error', error.message);
				}
			);
		}

		// Button handlers
		document.getElementById('btn-original').addEventListener('click', function() {
			this.classList.add('active');
			loadModel('../models/octahedralBone.glb', 'Original (Y-axis in Blender)');
		});

		document.getElementById('btn-zup').addEventListener('click', function() {
			this.classList.add('active');
			loadModel('../models/octahedralBoneZup.glb', 'Z-up (Blender Z → Three.js Y)');
		});

		document.getElementById('btn-yup').addEventListener('click', function() {
			this.classList.add('active');
			loadModel('../models/octahedralBoneYupModelsRotatedAndNormalized.glb', 'Y-up Rotated');
		});

		// Load Z-up by default (most likely to work)
		document.getElementById('btn-zup').click();

		// Animation loop
		function animate() {
			requestAnimationFrame(animate);
			controls.update();
			renderer.render(scene, camera);
		}

		// Handle window resize
		window.addEventListener('resize', () => {
			camera.aspect = window.innerWidth / window.innerHeight;
			camera.updateProjectionMatrix();
			renderer.setSize(window.innerWidth, window.innerHeight);
		});

		animate();
	</script>
</body>
</html>
